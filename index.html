<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATSScan - ATS Resume Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group label {
            font-weight: 600;
            color: #333;
            font-size: 1.05em;
        }

        .input-group textarea {
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1em;
            resize: vertical;
            min-height: 200px;
            transition: border-color 0.3s;
        }

        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .results-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .score-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .score-value {
            font-size: 3.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .score-label {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .score-status {
            font-size: 1.1em;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .result-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .result-box h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .result-box.matched {
            border-left-color: #10b981;
        }

        .result-box.missing {
            border-left-color: #ef4444;
        }

        .result-box.suggestions {
            border-left-color: #f59e0b;
            grid-column: 1 / -1;
        }

        .keyword-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .keyword-tag {
            background: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            border: 1px solid #ddd;
        }

        .keyword-tag.matched {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }

        .keyword-tag.missing {
            background: #fee2e2;
            border-color: #ef4444;
            color: #7f1d1d;
        }

        .suggestion-item {
            background: white;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border-left: 3px solid #f59e0b;
            font-size: 0.9em;
        }

        .suggestion-item strong {
            color: #667eea;
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .score-value {
                font-size: 2.5em;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #f0f0f0;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 ATSScan</h1>
            <p>Free ATS Resume Checker - Get Instant Feedback on Your Resume</p>
        </div>

        <div class="main-content">
            <!-- INPUT SECTION -->
            <div class="input-section">
                <div class="input-group">
                    <label for="resume">📋 Your Resume</label>
                    <textarea id="resume" placeholder="Paste your resume here or upload..."></textarea>
                </div>

                <div class="input-group">
                    <label for="jobDesc">🎯 Job Description</label>
                    <textarea id="jobDesc" placeholder="Paste the job description here..."></textarea>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="analyzeResume()">Analyze Resume</button>
                    <button class="btn btn-secondary" onclick="clearAll()">Clear All</button>
                </div>

                <input type="file" id="fileInput" accept=".txt,.pdf" style="display:none" onchange="handleFileUpload(event)">
                <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📤 Upload Resume</button>
            </div>

            <!-- RESULTS SECTION -->
            <div class="results-section" id="resultsSection" style="display: none;">
                <div class="score-card">
                    <div class="score-label">ATS Compatibility Score</div>
                    <div class="score-value" id="scoreValue">0%</div>
                    <div class="score-status" id="scoreStatus">Add resume and job description to analyze</div>
                    <div class="stats-row">
                        <div class="stat-item">
                            <div class="stat-value" id="matchedCount">0</div>
                            <div class="stat-label">Keywords Matched</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="missingCount">0</div>
                            <div class="stat-label">Keywords Missing</div>
                        </div>
                    </div>
                </div>

                <div class="results-grid">
                    <div class="result-box matched">
                        <h3>✅ Matched Keywords</h3>
                        <div class="keyword-list" id="matchedKeywords"></div>
                    </div>

                    <div class="result-box missing">
                        <h3>❌ Missing Keywords</h3>
                        <div class="keyword-list" id="missingKeywords"></div>
                    </div>

                    <div class="result-box suggestions">
                        <h3>💡 Suggestions to Improve Score</h3>
                        <div id="suggestionsContainer"></div>
                    </div>
                </div>
            </div>

            <div id="loadingSection" class="loading hidden">
                ⏳ Analyzing your resume...
            </div>
        </div>
    </div>

    <script>
        // KEYWORD EXTRACTION
        function extractKeywords(text) {
            // Common stop words
            const stopWords = new Set([
                'the', 'a', 'an', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'with', 'by',
                'from', 'is', 'are', 'am', 'be', 'been', 'being', 'have', 'has', 'had', 'do', 'does',
                'did', 'will', 'would', 'could', 'should', 'may', 'might', 'must', 'can', 'this', 'that',
                'these', 'those', 'i', 'you', 'he', 'she', 'it', 'we', 'they', 'what', 'which', 'who',
                'when', 'where', 'why', 'how', 'as', 'if', 'so', 'because', 'while', 'through', 'during',
                'before', 'after', 'above', 'below', 'up', 'down', 'out', 'off', 'over', 'under', 'again',
                'further', 'then', 'once', 'very', 'too', 'just', 'only', 'own', 'same', 'no', 'nor',
                'not', 'my', 'his', 'her', 'its', 'our', 'your', 'their', 'there', 'here'
            ]);

            // Technical skills keywords
            const techKeywords = [
                'python', 'javascript', 'java', 'c++', 'c#', 'php', 'ruby', 'go', 'rust', 'typescript',
                'react', 'angular', 'vue', 'nodejs', 'express', 'django', 'flask', 'spring',
                'sql', 'mysql', 'postgresql', 'mongodb', 'oracle', 'firebase',
                'html', 'css', 'json', 'xml', 'api', 'rest', 'graphql',
                'aws', 'azure', 'gcp', 'docker', 'kubernetes', 'jenkins',
                'git', 'agile', 'scrum', 'jira', 'slack',
                'machine learning', 'deep learning', 'ai', 'nlp', 'computer vision',
                'data science', 'analytics', 'tableau', 'power bi', 'excel',
                'communication', 'leadership', 'problem solving', 'teamwork', 'collaboration'
            ];

            // Convert to lowercase and split
            let words = text.toLowerCase().match(/\b[\w\s+#\-]+\b/g) || [];
            
            // Filter and extract meaningful keywords
            let keywords = new Map();
            
            words.forEach(word => {
                word = word.trim();
                if (word.length > 2 && !stopWords.has(word)) {
                    keywords.set(word, (keywords.get(word) || 0) + 1);
                }
            });

            // Add tech keywords with boosted score
            techKeywords.forEach(tech => {
                if (text.toLowerCase().includes(tech)) {
                    keywords.set(tech, (keywords.get(tech) || 0) + 5);
                }
            });

            // Sort by frequency
            return Array.from(keywords.entries())
                .sort((a, b) => b[1] - a[1])
                .slice(0, 30)
                .map(entry => entry[0]);
        }

        // ANALYZE RESUME
        function analyzeResume() {
            const resume = document.getElementById('resume').value.trim();
            const jobDesc = document.getElementById('jobDesc').value.trim();

            if (!resume || !jobDesc) {
                alert('Please enter both resume and job description');
                return;
            }

            showLoading(true);

            setTimeout(() => {
                const resumeKeywords = extractKeywords(resume);
                const jobKeywords = extractKeywords(jobDesc);

                // Calculate matches
                const matchedSet = new Set(resumeKeywords.filter(k => jobKeywords.includes(k)));
                const missingSet = new Set(jobKeywords.filter(k => !resumeKeywords.includes(k)));

                const matched = Array.from(matchedSet);
                const missing = Array.from(missingSet).slice(0, 15);

                // Calculate score
                const score = Math.round((matched.length / jobKeywords.length) * 100);

                // Display results
                displayResults(score, matched, missing, jobKeywords);
                showLoading(false);
            }, 500);
        }

        // DISPLAY RESULTS
        function displayResults(score, matched, missing, jobKeywords) {
            const resultsSection = document.getElementById('resultsSection');
            resultsSection.style.display = 'flex';

            // Update score
            document.getElementById('scoreValue').textContent = score + '%';
            document.getElementById('matchedCount').textContent = matched.length;
            document.getElementById('missingCount').textContent = missing.length;

            // Status message
            let status = '';
            if (score >= 80) status = '🌟 Excellent! Your resume is well-optimized';
            else if (score >= 60) status = '✨ Good! Add a few more keywords';
            else if (score >= 40) status = '⚠️ Fair! Missing key qualifications';
            else status = '❌ Poor! Add more relevant keywords';

            document.getElementById('scoreStatus').textContent = status;

            // Matched keywords
            const matchedHtml = matched.map(k => 
                `<span class="keyword-tag matched">${k}</span>`
            ).join('');
            document.getElementById('matchedKeywords').innerHTML = matchedHtml || 'No matches yet';

            // Missing keywords
            const missingHtml = missing.map(k => 
                `<span class="keyword-tag missing">${k}</span>`
            ).join('');
            document.getElementById('missingKeywords').innerHTML = missingHtml || 'All keywords matched!';

            // Suggestions
            const suggestions = generateSuggestions(score, missing, matched);
            const suggestionsHtml = suggestions.map(s => 
                `<div class="suggestion-item">${s}</div>`
            ).join('');
            document.getElementById('suggestionsContainer').innerHTML = suggestionsHtml;
        }

        // GENERATE SUGGESTIONS
        function generateSuggestions(score, missing, matched) {
            const suggestions = [];

            if (score < 40) {
                suggestions.push('<strong>Critical:</strong> Add technical skills that match the job description');
                suggestions.push('<strong>Important:</strong> Include industry-specific keywords in your professional summary');
            }

            if (missing.length > 0) {
                const topMissing = missing.slice(0, 3).join(', ');
                suggestions.push(`<strong>Missing Keywords:</strong> Add "${topMissing}" to your resume`);
            }

            if (score >= 40 && score < 60) {
                suggestions.push('<strong>Tip:</strong> Highlight these skills more prominently in your experience section');
            }

            if (matched.length > 0) {
                suggestions.push(`<strong>✅ Great:</strong> You have ${matched.length} key skills - make sure they're easy for ATS to find`);
            }

            if (score < 70) {
                suggestions.push('<strong>Optimize:</strong> Use cleaner formatting - avoid tables, graphics, and complex layouts');
                suggestions.push('<strong>Format:</strong> Save as .docx or .pdf to ensure ATS compatibility');
            }

            if (suggestions.length === 0) {
                suggestions.push('<strong>Perfect!</strong> Your resume matches the job description very well!');
            }

            return suggestions;
        }

        // HANDLE FILE UPLOAD
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('resume').value = e.target.result;
            };
            reader.readAsText(file);
        }

        // SHOW/HIDE LOADING
        function showLoading(show) {
            document.getElementById('loadingSection').style.display = show ? 'block' : 'none';
        }

        // CLEAR ALL
        function clearAll() {
            document.getElementById('resume').value = '';
            document.getElementById('jobDesc').value = '';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('fileInput').value = '';
        }
    </script>
</body>
</html>
