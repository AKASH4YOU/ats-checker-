<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATSScan - ATS Resume Checker</title>
    <link rel="stylesheet" href="style.css">
    <!-- PDF.js library for extracting text from PDF resumes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Mammoth.js library for extracting text from Word resumes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📄 ATSScan</h1>
            <p>Free ATS Resume Checker - Get Instant Feedback on Your Resume</p>
        </div>

        <div class="main-content">
            <!-- INPUT SECTION -->
            <div class="input-section">
                <div class="input-group">
                    <div class="label-row">
                        <label for="resume">📋 Your Resume</label>
                        <span id="uploadStatus" class="upload-status"></span>
                    </div>
                    <textarea id="resume"
                        placeholder="Paste your resume here or upload (.pdf, .docx, .txt)..."></textarea>
                </div>

                <div class="input-group">
                    <label for="jobDesc">🎯 Job Description</label>
                    <textarea id="jobDesc" placeholder="Paste the job description here..."></textarea>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="analyzeResume()">Analyze Resume</button>
                    <button class="btn btn-secondary" onclick="clearAll()">Clear All</button>
                </div>

                <input type="file" id="fileInput" accept=".pdf,.docx,.txt" style="display:none"
                    onchange="handleFileUpload(event)">
                <button type="button" class="btn btn-secondary" id="uploadBtn"
                    onclick="document.getElementById('fileInput').click()">📤 Upload Resume (.pdf, .docx, .txt)</button>
            </div>

            <!-- RESULTS SECTION -->
            <div class="results-section" id="resultsSection" style="display: none;">
                <div class="score-card">
                    <div class="score-label">ATS Compatibility Score</div>
                    <div class="score-value" id="scoreValue">0%</div>
                    <div class="score-status" id="scoreStatus">Add resume and job description to analyze</div>
                    <div class="stats-row">
                        <div class="stat-item">
                            <div class="stat-value" id="matchedCount">0</div>
                            <div class="stat-label">Keywords Matched</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="missingCount">0</div>
                            <div class="stat-label">Keywords Missing</div>
                        </div>
                    </div>
                </div>

                <div class="results-grid">
                    <div class="result-box matched">
                        <h3>✅ Matched Skills</h3>
                        <div class="keyword-list" id="matchedKeywords"></div>
                    </div>

                    <div class="result-box missing">
                        <h3>❌ Missing Skills</h3>
                        <div class="keyword-list" id="missingKeywords"></div>
                    </div>

                    <div class="result-box suggestions">
                        <h3>💡 Suggestions to Improve Score</h3>
                        <div id="suggestionsContainer"></div>
                    </div>
                </div>
            </div>

            <div id="loadingSection" class="loading hidden">
                ⏳ Analyzing your resume...
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
